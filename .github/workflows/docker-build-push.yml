name: Build and publish Docker images

on:
  push:
    branches:
      - main
  schedule:
    # Daily rebuild, to pick up upstream Alpine security updates.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: filigran/python-fips
            dockerfile: Dockerfile_python
            tags: |
              filigran/python-fips:python3.12
              filigran/python-fips:latest
          - image: filigran/python-nodejs-fips
            dockerfile: Dockerfile_python_nodejs
            tags: |
              filigran/python-nodejs-fips:python3.12-nodejs22
              filigran/python-nodejs-fips:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          no-cache: true
          tags: ${{ matrix.tags }}

  notify:
    name: Notify MS Teams
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send report to MS Teams
        env:
          WEBHOOK_URL: ${{ secrets.MS_TEAMS_WORKFLOW_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "MS_TEAMS_WORKFLOW_WEBHOOK_URL is not configured, skipping notification."
            exit 0
          fi

          case "${BUILD_RESULT}" in
            success) title="✅ Docker images published" ;;
            cancelled) title="⚠️ Docker build cancelled" ;;
            *) title="❌ Docker build failed" ;;
          esac

          jq -n \
            --arg title "${title}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg result "${BUILD_RESULT}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg sha "${GITHUB_SHA}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg run_url "${RUN_URL}" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      { type: "TextBlock", size: "Medium", weight: "Bolder", wrap: true, text: $title },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Repository", value: $repository },
                          { title: "Result", value: $result },
                          { title: "Ref", value: $ref },
                          { title: "Commit", value: $sha[0:7] },
                          { title: "Trigger", value: $event }
                        ]
                      }
                    ],
                    actions: [
                      { type: "Action.OpenUrl", title: "View workflow run", url: $run_url }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --silent --show-error --fail --retry 3 \
            --header "Content-Type: application/json" \
            --data @payload.json \
            "${WEBHOOK_URL}"
